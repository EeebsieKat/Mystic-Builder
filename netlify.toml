# Netlify deployment configuration
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Make game icons + fonts available to the OG image generator
[functions]
  included_files = ["public/fonts/**", "public/assets/**"]

# The Next.js runtime is enabled automatically by Netlify for Next sites.
# Declaring it here keeps things deterministic.
[[plugins]]
  package = "@netlify/plugin-nextjs"
